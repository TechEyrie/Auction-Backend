name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MONGOMS_VERSION: '7.0.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongoms-${{ env.MONGOMS_VERSION }}
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (includes real MongoDB integration tests)
        timeout-minutes: 20
        run: npm test
